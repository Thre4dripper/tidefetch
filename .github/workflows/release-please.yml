name: Release Please

# Every push to main updates a single "Release PR" that accumulates the
# changelog and bumps the version from Conventional Commit messages. Merging
# that PR is the release: it tags the commit and publishes the artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    # Calling the release workflow directly avoids needing a personal access
    # token: tags created with GITHUB_TOKEN do not trigger other workflows, so
    # a plain `on: push: tags` handoff would silently never run.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
