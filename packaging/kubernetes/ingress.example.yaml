apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tidefetch
  namespace: tidefetch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tidefetch.example.com
      secretName: tidefetch-tls
  rules:
    - host: tidefetch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tidefetch
                port:
                  name: http