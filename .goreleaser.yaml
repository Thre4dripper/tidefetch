# GoReleaser publishes Tidefetch to every supported registry on tag push.
# Validate locally with: goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: tidefetch

builds:
  - id: tidefetch
    main: ./cmd/tidefetch
    binary: tidefetch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # linux/armv7 covers 32-bit Raspberry Pi; arm64 covers everything modern.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - README.md
      - LICENSE
      # "docs/**/*" only matches depth >= 2, which silently dropped every
      # top-level page (installation.md, homelab.md, ...). "docs/**" is recursive.
      - docs/**

checksum:
  name_template: checksums.txt

# Artifacts are not GPG-signed. Provenance is attested instead by the release
# workflow (actions/attest-build-provenance), which binds each file to the
# workflow run and source commit without a long-lived key.

# Container images are built by the `docker` job in .github/workflows/release.yml
# with buildx, so it can run in parallel with this and reuse the layer cache.

homebrew_casks:
  - name: tidefetch
    binaries: [tidefetch]
    # The tap hosts multiple tools: each project owns exactly one file under
    # Casks/ and never touches its neighbours.
    directory: Casks
    commit_msg_template: "tidefetch: update cask to {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    repository:
      owner: Thre4dripper
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Thre4dripper/tidefetch
    description: Terminal UI and self-hosted web UI for the aria2 download engine
    license: MIT
    dependencies:
      - formula: aria2
    # Releases are not notarised, so clear the quarantine flag on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/tidefetch"]
          end

changelog:
  sort: asc
  # Compare against the previous tag rather than the GitHub API so the notes are
  # identical whether the release runs from a tag push or a manual dispatch.
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Thre4dripper
    name: tidefetch
  draft: false
  prerelease: auto
  footer: |
    ### Install

    ```sh
    # macOS, Linux
    curl -fsSL https://thre4dripper.github.io/tidefetch/install.sh | sh

    # Windows (PowerShell)
    irm https://thre4dripper.github.io/tidefetch/install.ps1 | iex

    # macOS via Homebrew
    brew install thre4dripper/tap/tidefetch

    # Containers
    docker pull ghcr.io/thre4dripper/tidefetch:{{ .Version }}
    ```

    Full documentation: https://thre4dripper.github.io/tidefetch/docs/installation
