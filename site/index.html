<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111316" />
    <style>
      /* Painted before the stylesheet arrives, so the first frame is never white. */
      html { background: #0c0e11; color-scheme: dark; }
      /* The document inside #app is prerendered for crawlers and no-JS readers.
         Keep it hidden until the app mounts so nobody sees unstyled markup. */
      #app > main[data-prerendered] { display: none; }
    </style>
    <noscript>
      <style>
        #app > main[data-prerendered] {
          display: block;
          max-width: 760px;
          margin: 0 auto;
          padding: 40px 24px;
          color: #e8edea;
          font: 16px/1.6 ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #app > main[data-prerendered] a { color: #5ed8e7; }
        #app > main[data-prerendered] pre { overflow-x: auto; }
      </style>
    </noscript>

    <title>Tidefetch — Terminal UI and Self-Hosted Web UI for aria2</title>
    <meta
      data-prerendered
      name="description"
      content="Tidefetch is a keyboard-first terminal UI (TUI) for the aria2 download manager, plus an optional self-hosted web UI for headless servers and homelabs. One static binary, no runtime. Supports HTTP, FTP, SFTP, BitTorrent and Metalink."
    />
    <!-- __SITE_URL__ is replaced at build time with the publish address; see vite.config.ts. -->
    <link data-prerendered rel="canonical" href="__SITE_URL__" />
    <meta name="author" content="Thre4dripper" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:site_name" content="Tidefetch" />
    <meta data-prerendered property="og:title" content="Tidefetch — Terminal UI and Self-Hosted Web UI for aria2" />
    <meta
      data-prerendered
      property="og:description"
      content="A keyboard-first TUI for aria2, with an optional self-hosted web UI for headless servers and homelabs. One static binary, no runtime, Docker and Helm ready."
    />
    <meta property="og:type" content="website" />
    <meta data-prerendered property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__media/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tidefetch — a fast terminal UI for aria2, with a web UI when you need one." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta data-prerendered name="twitter:title" content="Tidefetch — Terminal UI and Self-Hosted Web UI for aria2" />
    <meta
      data-prerendered
      name="twitter:description"
      content="A keyboard-first TUI for aria2, with an optional self-hosted web UI for headless servers and homelabs."
    />
    <meta name="twitter:image" content="__SITE_URL__media/og-card.png" />

    <link rel="icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Tidefetch",
        "description": "A keyboard-first terminal UI for the aria2 download manager, with an optional self-hosted web UI for headless servers and homelabs.",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "Download Manager",
        "operatingSystem": "macOS, Linux, Windows",
        "url": "__SITE_URL__",
        "downloadUrl": "https://github.com/Thre4dripper/tidefetch/releases",
        "codeRepository": "https://github.com/Thre4dripper/tidefetch",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "programmingLanguage": "Go",
        "screenshot": "__SITE_URL__media/og-card.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Thre4dripper",
          "url": "https://github.com/Thre4dripper"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
